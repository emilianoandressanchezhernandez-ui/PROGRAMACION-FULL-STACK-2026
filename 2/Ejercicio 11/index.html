<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <h1>Ejercicio Tareas</h1>

        <section class="apartado">
            <form id="formulario">
                <div class="grupo-input">
                    <input type="text" id="tarea" placeholder="Ingrese una tarea">
                    <button type="submit" id="btn-agregar">Agregar</button>
                </div>
                <div id="error" class="mensaje-error"></div>
            </form>
        </section>

        <section class="apartado clasificacion">
            <div class="filtros">
                <button class="btn-filtro activo" data-filtro="todas">Todas</button>
                <button class="btn-filtro" data-filtro="pendientes">Pendientes</button>
                <button class="btn-filtro" data-filtro="completadas">Completadas</button>
            </div>
            <button id="btn-borrar-todo" class="btn-eliminar">Borrar Todo</button>
        </section>

        <section class="apartado contador">
            <div class="estilo-caja">Total: <span id="total-tareas">0</span></div>
            <div class="estilo-caja">Pendientes: <span id="tareas-pendientes">0</span></div>
            <div class="estilo-caja">Completadas: <span id="tareas-completadas">0</span></div>
        </section>

        <section class="apartado-lista">
            <ul id="lista-tareas"></ul>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
